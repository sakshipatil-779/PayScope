services:
  postgres:
    image: postgres:16-alpine
    container_name: mandatelens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mandatelens}
      POSTGRES_USER: ${POSTGRES_USER:-mandatelens_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mandatelens_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mandatelens-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mandatelens_dev} -d ${POSTGRES_DB:-mandatelens}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: mandatelens_postgres_data

networks:
  mandatelens-network:
    name: mandatelens_network
    driver: bridge
