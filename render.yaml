services:
  - type: web
    name: payscope-api
    runtime: python
    buildCommand: "pip install uv && cd apps/api && uv sync"
    startCommand: "cd apps/api && uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 10000
      - key: BACKEND_CORS_ORIGINS
        value: "https://payscope.vercel.app,http://localhost:3000"
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: NEO4J_ENABLED
        value: "true"
    healthCheckPath: /api/v1/health
    autoDeploy: true
